<title>Realty Deal Chat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600&display=swap">
<style>
/* Layout: three-pane workspace — inbox | deal conversation pinned to a property | files/deal panel. Stacks to one pane on phones. */
:root{
  --bg:#eef1ee; --surface:#ffffff; --sunken:#f4f6f3; --line:#dfe4df;
  --fg:#18201c; --muted:#5d6a63; --faint:#8d9891;
  --brand:#1d6b52; --brand-ink:#ffffff; --brand-soft:#e1efe8; --brand-strong:#134a39;
  --read:#2f7fe0; --warn-bg:#fff4dc; --warn-fg:#7a4f00; --warn-line:#f1d595;
  --danger:#c8382c; --danger-soft:#fdebe9;
  --mine:#1d6b52; --mine-fg:#ffffff; --theirs:#ffffff;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(16,40,30,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#161d1a; --sunken:#1c2521; --line:#27322d;
  --fg:#e7eee9; --muted:#9fb0a7; --faint:#71817a;
  --brand:#3fa883; --brand-ink:#08140f; --brand-soft:#173329; --brand-strong:#8fdcbd;
  --read:#5ea4ff; --warn-bg:#33280f; --warn-fg:#f3cf7c; --warn-line:#5a4618;
  --danger:#ff6b5e; --danger-soft:#3a1714;
  --mine:#2c8a68; --mine-fg:#ffffff; --theirs:#1f2925;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#161d1a; --sunken:#1c2521; --line:#27322d;
  --fg:#e7eee9; --muted:#9fb0a7; --faint:#71817a;
  --brand:#3fa883; --brand-ink:#08140f; --brand-soft:#173329; --brand-strong:#8fdcbd;
  --read:#5ea4ff; --warn-bg:#33280f; --warn-fg:#f3cf7c; --warn-line:#5a4618;
  --danger:#ff6b5e; --danger-soft:#3a1714;
  --mine:#2c8a68; --mine-fg:#ffffff; --theirs:#1f2925;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:10px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:17px;letter-spacing:-.02em;color:var(--brand-strong)}
.logo small{font-family:var(--body);font-size:11px;font-weight:500;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
.roles{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-left:auto}
.roles button{padding:6px 12px;border-radius:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}

.shell{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.shell.panel-open{grid-template-columns:320px minmax(0,1fr) 300px}

/* inbox */
.inbox{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.inbox h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0;padding:14px 14px 8px}
.chips{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.convs{overflow-y:auto;flex:1;min-height:0}
.conv{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.conv:hover{background:var(--sunken)}
.conv[aria-current="true"]{background:var(--brand-soft)}
.thumb{width:48px;height:48px;border-radius:9px;position:relative;overflow:hidden}
.thumb span{position:absolute;inset:auto 0 0;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:center;color:#fff;background:rgba(0,0,0,.45)}
.row{display:flex;align-items:baseline;gap:6px;min-width:0}
.row .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.last{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);min-width:0}
.last .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.last.unread .txt{color:var(--fg);font-weight:600}
.badge{background:var(--brand);color:var(--brand-ink);border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;font-variant-numeric:tabular-nums}
.waiting{font-size:11px;color:var(--warn-fg);font-weight:600;margin-top:3px}
.blockedtag{font-size:11px;color:var(--danger);font-weight:600;margin-top:3px}

/* chat */
.chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.back{display:none;font-size:20px;line-height:1;padding:4px 6px;color:var(--muted)}
.who{flex:1;min-width:0}
.who b{display:block}
.who small{color:var(--faint);font-size:12px}
.who small.typing{color:var(--brand)}
.ghost{font-size:12.5px;padding:6px 10px;border-radius:8px;color:var(--muted);white-space:nowrap}
.ghost:hover{background:var(--sunken);color:var(--fg)}
.ghost.danger{color:var(--danger)}
.ghost.danger:hover{background:var(--danger-soft)}

.prop{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunken)}
.prop .ph{height:58px;border-radius:9px}
.prop .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prop .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--brand-soft);color:var(--brand-strong);margin-right:6px}
.pill.res{background:var(--warn-bg);color:var(--warn-fg)}
.pill.closed{background:var(--danger-soft);color:var(--danger)}
.btn{background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:13px;padding:8px 12px;border-radius:9px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.line{background:transparent;color:var(--brand-strong);border:1.5px solid var(--brand)}
.btn.red{background:var(--danger);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}

.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.notice{align-self:center;max-width:420px;text-align:center;font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.day{align-self:center;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.m{display:flex;flex-direction:column;max-width:min(76%,520px)}
.m.mine{align-self:flex-end;align-items:flex-end}
.m.theirs{align-self:flex-start;align-items:flex-start}
.bubble{position:relative;padding:8px 12px 6px;border-radius:16px;box-shadow:var(--shadow);overflow-wrap:anywhere}
.mine .bubble{background:var(--mine);color:var(--mine-fg);border-bottom-right-radius:5px}
.theirs .bubble{background:var(--theirs);border-bottom-left-radius:5px}
.m.blocked .bubble{background:var(--danger-soft);color:var(--fg);outline:1px solid var(--danger)}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;margin-top:2px;opacity:.75;font-variant-numeric:tabular-nums}
.ticks{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:4px;padding:1px 2px;height:14px}
.ticks svg{width:18px;height:11px;color:#8d9891}
.ticks.read svg{color:var(--read)}
.ticks.pending svg{width:12px;height:12px}
.bang{width:15px;height:15px;border-radius:50%;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.flag{position:absolute;top:4px;right:-26px;opacity:0;color:var(--faint);padding:3px;border-radius:6px}
.m.theirs:hover .flag,.flag:focus-visible{opacity:1}
.flag:hover{color:var(--danger);background:var(--danger-soft)}
.tip{max-width:100%;font-size:12px;background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line);border-radius:10px;padding:6px 10px;margin-bottom:4px}
.blocknote{font-size:11.5px;color:var(--danger);margin-top:3px;text-align:right;max-width:340px}
.hiddenmsg{font-size:12px;font-style:italic;color:var(--faint);border:1px dashed var(--line);border-radius:12px;padding:6px 10px}
.sys{align-self:center;max-width:440px;background:var(--brand-soft);color:var(--brand-strong);border-radius:12px;padding:8px 12px;font-size:12.5px;text-align:center}
.sys .sim{display:grid;gap:6px;margin-top:8px;text-align:left}
.sys .sim div{background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 9px;font-size:12px}
.sys .sim b{display:block}
.card{min-width:220px}
.card .k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.8;margin-bottom:5px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:12.5px;font-variant-numeric:tabular-nums}
.card dt{opacity:.7}.card dd{margin:0;font-weight:600}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.slots li{display:flex;justify-content:space-between;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.slots li.chosen{font-weight:700;text-decoration:underline}
.mini{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--brand);color:var(--brand-ink)}
.mini.out{background:transparent;border:1px solid currentColor;color:inherit}
.state{font-size:11px;font-weight:600;margin-top:5px;opacity:.85}
.atts{display:grid;gap:5px;margin-bottom:5px}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,120px));gap:4px}
.photos .ph{aspect-ratio:4/3;border-radius:9px;max-width:100%;display:flex;align-items:flex-end;padding:4px 6px;font-size:10px;color:#fff;overflow:hidden;background-size:cover;background-position:center}
.doc{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:9px;background:rgba(127,127,127,.14);font-size:12px;max-width:260px}
.ext{font-size:9.5px;font-weight:800;text-transform:uppercase;color:#fff;background:#c8382c;border-radius:4px;padding:2px 4px}
.ext.docx{background:#2f6fd0}.ext.xlsx{background:#1f8a4c}
.doc .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .sz{opacity:.7;font-variant-numeric:tabular-nums}

/* composer */
.quick{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto}
.quick button{flex:none;font-size:12px;padding:5px 11px;border-radius:999px;background:var(--brand-soft);color:var(--brand-strong);border:1px solid transparent}
.quick button:hover{border-color:var(--brand)}
.pending{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0}
.pf{font-size:12px;border:1px solid var(--line);border-radius:9px;padding:4px 8px;display:flex;gap:6px;align-items:center;max-width:220px}
.pf.err{border-color:var(--danger);color:var(--danger)}
.pf span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;resize:none;border:0;border-radius:12px;background:var(--sunken);padding:10px 12px;min-height:42px;max-height:120px}
.composer textarea:focus{outline:2px solid var(--brand)}
.icon{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.icon:hover{background:var(--sunken)}
.hint{font-size:11px;color:var(--faint);padding:0 14px 8px}

/* side panel */
.panel{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.panel header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.panel h3{margin:0;font-size:14px}
.filters{display:grid;gap:7px;padding:0 14px 10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunken);border-radius:9px;padding:3px;gap:2px}
.seg button{font-size:12px;padding:5px;border-radius:7px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.filters input,.filters select,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:12.5px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.files{flex:1;min-height:0;overflow-y:auto;padding:0 8px 10px;list-style:none;margin:0}
.files li{display:flex;gap:9px;align-items:center;padding:7px 6px;border-radius:9px}
.files li:hover{background:var(--sunken)}
.files .ico{width:34px;height:34px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;text-transform:uppercase;color:#fff}
.files .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .d{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.empty{padding:28px 14px;text-align:center;color:var(--faint);font-size:12.5px}
.totals{font-size:11px;color:var(--faint);padding:0 14px 6px;font-variant-numeric:tabular-nums}

/* support */
.support{grid-column:1/-1;display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0}
.queue{border-right:1px solid var(--line);overflow-y:auto;min-height:0}
.rep{display:block;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.rep:hover{background:var(--sunken)}
.rep[aria-current="true"]{background:var(--brand-soft)}
.sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.auto{font-size:9.5px;font-weight:800;letter-spacing:.06em;background:var(--fg);color:var(--surface);border-radius:4px;padding:1px 5px;margin-left:6px}
.case{overflow-y:auto;padding:18px;min-height:0;display:grid;gap:12px;align-content:start}
.box{background:var(--sunken);border-radius:12px;padding:12px 14px}
.ctx{display:grid;gap:5px}
.ctx div{font-size:13px;padding:6px 9px;border-radius:8px;background:var(--surface)}
.ctx div.bad{outline:1px solid var(--danger)}
.ctx small{color:var(--faint);margin-right:6px}
.flags{font-size:11px;color:var(--danger);display:block}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* dialogs & toasts */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.42);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.dlg{background:var(--surface);border-radius:16px;padding:18px;width:min(440px,100%);max-height:90%;overflow-y:auto;display:grid;gap:12px}
.dlg h3{margin:0;font-size:16px}
.dlg .x{justify-self:end;margin-top:-30px;color:var(--faint);font-size:18px}
.reasons{display:grid;gap:2px}
.reasons label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13.5px;cursor:pointer}
.reasons label:hover{background:var(--sunken)}
.reasons input{accent-color:var(--brand)}
.quote{font-size:12.5px;background:var(--sunken);border-radius:9px;padding:8px 10px;color:var(--muted)}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toasts{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:50;max-width:min(360px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--surface);border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.18);text-align:left}
.toast.warn{background:#b7791f;color:#fff}.toast.err{background:var(--danger);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}

@media (max-width:820px){
  .shell,.shell.panel-open{grid-template-columns:minmax(0,1fr)}
  .shell .inbox{display:none}
  .shell.list .inbox{display:flex}
  .shell.list .chat,.shell.list .panel{display:none}
  .shell.panel-open .chat{display:none}
  .back{display:block}
  .prop{grid-template-columns:60px minmax(0,1fr)}
  .prop .ph{height:46px}
  .prop .cta{grid-column:1/-1}
  .support{grid-template-columns:minmax(0,1fr)}
  .queue{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}
  .flag{right:-22px}
  .roles{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){
  .m{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

<div class="app">
  <div class="top">
    <div class="logo">realty<small>Deal chat · prototype</small></div>
    <div class="legend" aria-label="Message status legend">
      <span><i class="ticks" id="lg1"></i> sent</span>
      <span><i class="ticks" id="lg2"></i> delivered</span>
      <span><i class="ticks read" id="lg3"></i> read</span>
    </div>
    <div class="roles" role="group" aria-label="View as">
      <button data-role="buyer" aria-pressed="true">Tenant / Buyer</button>
      <button data-role="seller" aria-pressed="false">Landlord / Seller</button>
      <button data-role="support" aria-pressed="false">Support</button>
    </div>
  </div>
  <div class="shell" id="shell"></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal"></div>

<script>
(function(){
// ---------- icons ----------
const TICK1='<svg viewBox="0 0 20 12"><path d="M1.5 6.5l3.2 3.2L11 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TICK2='<svg viewBox="0 0 20 12"><path d="M1.5 6.5l3.2 3.2L11 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.8 9.4l.3.3L14.5 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CLOCK='<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 5v3.2l2 1.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const FLAG='<svg viewBox="0 0 16 16" width="15" height="15"><path d="M3.5 14V2.5h8l-1.6 3 1.6 3h-8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const CLIP='<svg viewBox="0 0 20 20" width="20" height="20"><path d="M14.5 9.5l-5.3 5.3a3.2 3.2 0 01-4.5-4.5l6-6a2.1 2.1 0 013 3l-6 6a1 1 0 01-1.5-1.5l5.3-5.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
document.getElementById('lg1').innerHTML=TICK1;document.getElementById('lg2').innerHTML=TICK2;document.getElementById('lg3').innerHTML=TICK2;

function ticks(status){
  if(status==='pending') return '<i class="ticks pending" title="Sending">'+CLOCK+'</i>';
  if(status==='blocked') return '<i class="bang" title="Not delivered">!</i>';
  if(status==='sent') return '<i class="ticks" title="Sent">'+TICK1+'</i>';
  if(status==='delivered') return '<i class="ticks" title="Delivered">'+TICK2+'</i>';
  return '<i class="ticks read" title="Read">'+TICK2+'</i>';
}

// ---------- moderation (same rules as apps/api/src/moderation/rules.ts) ----------
const PROF=[/\bf+u+c+k+\w*/gi,/\bs+h+i+t+\w*/gi,/\bb+i+t+c+h+\w*/gi,/(?<![а-яё])[хx][уy][йиеёяю]\S*/gi,/(?<![а-яё])бл[яa]\S*/gi,/(?<![а-яё])пизд\S*/gi,/(?<![а-яё])[её]б[аауоы]\S*/gi,/(?<![а-яё])сук[аи](?![а-яё])/gi];
const URL_RE=/\b((?:https?:\/\/|www\.)[^\s<>"']+|[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|net|org|ru|xyz|top|click|link|info|online|site|shop|app|biz|ge|io|me|co|ly|gl|gd|at|cc|to|pw|ws|su|tk)(?:\/[^\s<>"']*)?)(?![\w-])/gi;
const SHORT=['bit.ly','tinyurl.com','t.co','goo.gl','cutt.ly','is.gd','rb.gy','clck.ru'];
const SAFE=['google.com','maps.google.com','mapbox.com','stripe.com'];
const FRAUD=[
 [/western\s*union|moneygram|золотая\s*корона/i,'offplatform_transfer',2],
 [/\b(usdt|bitcoin|btc|crypto|tether)\b|крипт|биткоин/i,'crypto_payment',2],
 [/(deposit|prepay\w*|advance|предоплат\w*|задат\w*|аванс\w*).{0,40}(before|without|до|без).{0,20}(view\w*|see\w*|showing|просмотр\w*|осмотр\w*)/i,'prepay_before_viewing',2],
 [/(i\s*am|i'm|я)\s*(abroad|out of the country|за\s*границ\w*).{0,80}(keys?|ключ\w*)/i,'absent_owner_keys_by_mail',2],
 [/(pay|transfer|send|переве\w*|оплат\w*).{0,30}(outside|directly|напрямую|на\s*карт\w*)/i,'pay_outside_platform',1],
 [/(whats\s*app|telegram|телеграм\w*|viber|вотсап\w*|ватсап\w*)/i,'move_off_platform',1],
 [/\b(cvv|cvc|sms[\s-]*code|one[\s-]*time\s*code)\b|код\s*из\s*смс|смс[\s-]*код/i,'credential_request',3],
 [/(urgent|срочно|today only|other (buyers|tenants) waiting|много желающих)/i,'pressure',1]];
function luhn(n){let s=0,a=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(a){d*=2;if(d>9)d-=9}s+=d;a=!a}return s%10===0}
function moderate(text){
  const flags=new Set();let clean=text,score=0,hard=false;
  if(!text||!text.trim()) return {verdict:'ALLOW',flags:[],clean:text};
  for(const re of PROF){re.lastIndex=0;if(re.test(clean)){flags.add('profanity');clean=clean.replace(re,m=>m[0]+'*'.repeat(Math.max(m.length-1,2)))}re.lastIndex=0}
  for(const m of text.matchAll(URL_RE)){let h='';try{h=new URL(m[0].startsWith('http')?m[0]:'http://'+m[0]).hostname.toLowerCase()}catch(e){}
    if(!h||SAFE.some(d=>h===d||h.endsWith('.'+d)))continue;
    if(SHORT.includes(h)){flags.add('phishing_shortener');hard=true}
    else if(/^\d{1,3}(\.\d{1,3}){3}$/.test(h)){flags.add('phishing_ip_url');hard=true}
    else if(h.includes('xn--')){flags.add('phishing_punycode');hard=true}
    else if(h.includes('realty')){flags.add('phishing_brand_lookalike');hard=true}
    else if(/(verify|confirm|secure|login|payment|wallet|refund|account)/i.test(m[0])){flags.add('phishing_suspicious_link');score+=2}
    else flags.add('external_link')}
  for(const m of text.matchAll(/(?:\d[ -]?){13,19}/g)){const d=m[0].replace(/\D/g,'');if(d.length>=13&&d.length<=19&&luhn(d)){flags.add('card_number');hard=true}}
  for(const [re,f,w] of FRAUD){if(re.test(text)){flags.add(f);score+=w}}
  if(flags.has('credential_request'))hard=true;
  let verdict='ALLOW';if(hard||score>=4)verdict='BLOCK';else if(score>=1||flags.has('profanity')||flags.has('external_link'))verdict='WARN';
  let tip;
  if(verdict==='WARN'){
    if(['prepay_before_viewing','pay_outside_platform','offplatform_transfer','crypto_payment'].some(f=>flags.has(f)))tip='Never pay a deposit before viewing or outside the platform. Use the secure reservation deposit: the money is held until you confirm move-in.';
    else if(flags.has('move_off_platform'))tip='Keep the conversation here. Messages, documents and agreements in this chat can be reviewed by Support if something goes wrong.';
    else if(flags.has('external_link')||flags.has('phishing_suspicious_link'))tip='This message contains an external link. Do not enter passwords or card details on sites you reached from a chat.';
    else tip='Some words were hidden by the moderation filter.';
  }
  return {verdict,flags:[...flags],clean,tip};
}

     ${p.note?`<div class="state" style="font-weight:400">${esc(p.note)}</div>`:''}<div class="state">${{PENDING:'Waiting for answer',ACCEPTED:'✓ Confirmed',DECLINED:'✕ Declined'}[p.status]}</div>
     ${canAnswer?`<button class="mini out" style="margin-top:5px" data-decline="${m.id}">None of these work</button>`:''}</div>`}

     ${canAnswer?`<div style="display:flex;gap:6px;margin-top:6px"><button class="mini" data-accept="${m.id}">Accept</button><button class="mini out" data-reject="${m.id}">Decline</button></div>`:''}
     ${!isMine&&p.status==='ACCEPTED'&&p.deposit?`<button class="mini" style="margin-top:6px" data-pay="${m.id}">Pay secure deposit</button>`:''}</div>`}
  if(m.atts&&m.atts.length){const ph=m.atts.filter(a=>a.kind==='PHOTO'),dc=m.atts.filter(a=>a.kind==='DOCUMENT');

     ${dc.map(a=>`<div class="doc"><span class="ext ${ext(a.name)}">${ext(a.name)}</span><span class="fn">${esc(a.name)}</span><span class="sz">${bytes(a.size)}</span></div>`).join('')}</div>`}
  if(m.body)inner+=`<div>${esc(m.body)}</div>`;

  return `<div class="m ${isMine?'mine':'theirs'} ${m.status==='blocked'&&isMine?'blocked':''}">${tip}<div class="bubble">${flag}${inner}<div class="meta">${tm(m.at)} ${isMine&&m.status?ticks(m.status):''}</div></div>${note}${warnOut}</div>`;
}

function allFiles(c){return c.messages.filter(m=>visible(c,m)&&!m.hidden&&m.verdict!=='BLOCK').flatMap(m=>m.atts||[])}
function renderPanel(c){
  const f=S.files;const buckets=[['Any size'],['< 1 MB',0,1048576],['1–3 MB',1048576,3145728],['> 3 MB',3145728,Infinity]];
  const all=allFiles(c);
  let items=all.filter(a=>(!f.kind||a.kind===f.kind)&&(!f.q||a.name.toLowerCase().includes(f.q.toLowerCase()))&&(!f.type||ext(a.name)===f.type||(f.type==='jpg'&&ext(a.name)==='jpeg')));
  const b=buckets[f.size];if(b.length>1)items=items.filter(a=>a.size>=b[1]&&a.size<b[2]);
  items.sort(f.sort==='size'?(x,y)=>y.size-x.size:f.sort==='name'?(x,y)=>x.name.localeCompare(y.name):(x,y)=>y.at-x.at);
  const types=[...new Set(all.map(a=>ext(a.name)))].sort();
  const totPh=all.filter(a=>a.kind==='PHOTO'),totDc=all.filter(a=>a.kind==='DOCUMENT');
  return `<aside class="panel"><header><h3>Files in this deal</h3><button class="ghost" data-act="files" aria-label="Close files">✕</button></header>
   <div class="totals">${totPh.length} photos · ${totDc.length} documents · ${bytes(all.reduce((s,a)=>s+a.size,0))}</div>
   <div class="filters"><div class="seg">${[['','All'],['PHOTO','Photos'],['DOCUMENT','Docs']].map(([v,l])=>`<button data-fk="${v}" aria-pressed="${f.kind===v}">${l}</button>`).join('')}</div>
    <input id="fq" placeholder="Search by file name" value="${esc(f.q)}" aria-label="Search by file name">
    <div class="three"><select id="ft" aria-label="File type"><option value="">Any type</option>${types.map(t=>`<option ${f.type===t?'selected':''} value="${t}">${t.toUpperCase()}</option>`).join('')}</select>
     <select id="fs" aria-label="File size">${buckets.map((x,i)=>`<option value="${i}" ${f.size===i?'selected':''}>${x[0]}</option>`).join('')}</select>
     <select id="fo" aria-label="Sort"><option value="date" ${f.sort==='date'?'selected':''}>Newest</option><option value="size" ${f.sort==='size'?'selected':''}>Largest</option><option value="name" ${f.sort==='name'?'selected':''}>Name A–Z</option></select></div></div>
   <ul class="files">${items.length?items.map((a,i)=>`<li><span class="ico" style="background:${a.kind==='PHOTO'?(a.url?`center/cover url(${a.url})`:photoBg(i,listings[c.listing].hue)):ext(a.name)==='docx'?'#2f6fd0':ext(a.name)==='xlsx'?'#1f8a4c':'#c8382c'}">${a.kind==='PHOTO'?'':ext(a.name)}</span><div style="min-width:0"><div class="nm">${esc(a.name)}</div><div class="d">${bytes(a.size)} · ${rel(a.at)}</div></div></li>`).join(''):'<li class="empty">No files match these filters</li>'}</ul></aside>`;
}

function renderSupport(){
  const sel=reports.find(r=>r.id===S.report)||null;
  const sevColor=s=>s>=4?'var(--danger)':s>=2?'#d39a1c':'var(--faint)';
  const q=reports.map(r=>`<button class="rep" data-r="${r.id}" aria-current="${r.id===S.report}"><div><span class="sev" style="background:${sevColor(r.sev)}"></span><b>${esc(REASONS.find(x=>x[0]===r.reason)[1])}</b>${r.auto?'<span class="auto">AUTO</span>':''}</div>
   <div class="sub">${esc(r.reporter)} → <b>${esc(users[r.against].name)}</b> · ${r.status.toLowerCase()}</div>${r.comment?`<div class="sub" style="font-style:italic">${esc(r.comment)}</div>`:''}</button>`).join('');
  let detail='<div class="empty">Select a report from the queue</div>';
  if(sel){const c=conv(sel.conv);
    detail=`<div class="box"><b>${esc(REASONS.find(x=>x[0]===sel.reason)[1])}</b> · reported user: <b>${esc(users[sel.against].name)}</b>${c.status==='BLOCKED'?' <span class="pill closed">Blocked</span>':''}
     <div class="sub" style="white-space:normal;margin-top:4px">${esc(sel.comment||'No comment')}</div></div>
     <div class="box"><div style="font-weight:600;margin-bottom:8px">Conversation · ${esc(listings[c.listing].title)}</div><div class="ctx">${c.messages.map(m=>`<div class="${m.from===sel.against?'bad':''}"><small>${m.from?esc(users[m.from].name):'System'} · ${tm(m.at)}</small>${m.hidden?'<i>[hidden]</i> ':''}${esc(m.body||'['+m.kind+']')}${m.flags&&m.flags.length?`<span class="flags">${m.verdict}: ${m.flags.join(', ')}</span>`:''}</div>`).join('')}</div></div>
     ${sel.status==='OPEN'?`<div class="actions"><button class="btn line" data-sa="dismiss">Dismiss</button><button class="btn" style="background:#b7791f;color:#fff" data-sa="warn">Warn user</button><button class="btn" style="background:var(--fg);color:var(--surface)" data-sa="hide">Hide flagged messages</button><button class="btn red" data-sa="block">Block user</button></div>`:`<div class="box">Closed: ${esc(sel.resolution)}</div>`}`}
  return `<div class="queue"><div class="inbox" style="border:0"><h2>Report queue · sorted by severity</h2></div>${q}</div><div class="case">${detail}</div>`;
}

// ---------- events ----------
document.querySelector('.roles').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.role=b.dataset.role;S.panel=false;S.pending=[];if(S.role==='support'&&!S.report)S.report=reports[0]?.id;openConv(S.active,true)});

function openConv(id,keep){
  if(S.role!=='support'){const c=conv(id)&&mine().includes(conv(id))?conv(id):mine()[0];S.active=c.id;
    // opening a chat = blue ticks for the other side
    c.messages.forEach(m=>{if(m.from&&m.from!==me()&&m.verdict!=='BLOCK')m.status='read'});}
  if(!keep)S.pending=[];
  render();
}

function bindChat(){
  shell.querySelectorAll('.conv').forEach(b=>b.onclick=()=>{S.mobileList=false;openConv(b.dataset.c)});
  shell.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;render()});
  const c=conv(S.active);
  const on=(sel,fn)=>shell.querySelectorAll(sel).forEach(el=>el.onclick=()=>fn(el));
  on('[data-act="send"]',()=>send());
  on('[data-act="files"]',()=>{S.panel=!S.panel;render()});
  on('[data-act="list"]',()=>{S.mobileList=true;S.panel=false;render()});
  on('[data-act="attach"]',()=>shell.querySelector('#file').click());
  on('[data-act="meeting"]',()=>meetingDialog());
  on('[data-act="offer"]',()=>offerDialog());
  on('[data-act="reportUser"]',()=>reportDialog(null));
  on('[data-act="ff"]',()=>fastForward(c));
  on('[data-report]',el=>reportDialog(c.messages.find(m=>m.id===el.dataset.report)));
  on('[data-tpl]',el=>{const t=templates[+el.dataset.tpl];const l=listings[c.listing];const ta=shell.querySelector('#text');
    ta.value=t.b.replace('{{buyerName}}',users[c.buyer].name.split(' ')[0]).replace('{{listingTitle}}',l.title).replace('{{price}}',money(l.price,l.cur,l.per));ta.focus()});
  on('[data-rm]',el=>{S.pending.splice(+el.dataset.rm,1);render()});
  on('[data-slot]',el=>{const [mid,s]=el.dataset.slot.split('|');answer(c,mid,'ACCEPTED',+s)});
  on('[data-decline]',el=>answer(c,el.dataset.decline,'DECLINED'));
  on('[data-accept]',el=>answer(c,el.dataset.accept,'ACCEPTED'));
  on('[data-reject]',el=>answer(c,el.dataset.reject,'DECLINED'));
  on('[data-pay]',()=>payDialog(c));
  const ta=shell.querySelector('#text');
  if(ta){ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};}
  const fi=shell.querySelector('#file');
  if(fi)fi.onchange=()=>{addFiles(fi.files);fi.value=''};
  // files panel
  on('[data-fk]',el=>{S.files.kind=el.dataset.fk;render()});
  const fq=shell.querySelector('#fq');if(fq){fq.oninput=()=>{S.files.q=fq.value;const pos=fq.selectionStart;render();const n=shell.querySelector('#fq');n.focus();n.setSelectionRange(pos,pos)}}
  const sel=(id,k,num)=>{const el=shell.querySelector(id);if(el)el.onchange=()=>{S.files[k]=num?+el.value:el.value;render()}};
  sel('#ft','type');sel('#fs','size',true);sel('#fo','sort');
}

const RULES={PHOTO:{max:15*1048576,ext:['jpg','jpeg','png','webp','heic']},DOCUMENT:{max:25*1048576,ext:['pdf','doc','docx','xls','xlsx','txt']}};
function addFiles(list){
  [...list].slice(0,10).forEach(f=>{const e=ext(f.name);const kind=RULES.PHOTO.ext.includes(e)?'PHOTO':RULES.DOCUMENT.ext.includes(e)?'DOCUMENT':null;
    let err=!kind?'Type not allowed':f.size>RULES[kind].max?'Max '+bytes(RULES[kind].max):'';
    let url;if(kind==='PHOTO'&&!err&&e!=='heic'){try{url=URL.createObjectURL(f)}catch(x){}}
    S.pending.push({name:f.name,size:f.size,kind,err,url})});
  const text=shell.querySelector('#text')?.value||'';render();shell.querySelector('#text').value=text;
}

function send(){
  const c=conv(S.active);const ta=shell.querySelector('#text');const text=ta.value.trim();
  const files=S.pending.filter(p=>!p.err);
  if(!text&&!files.length)return;
  const atts=files.map(p=>({id:'a'+(++seq),name:p.name,size:p.size,kind:p.kind,at:Date.now(),url:p.url}));
  const msg={id:id(),from:me(),kind:atts.length?'ATTACHMENT':'TEXT',body:text||null,atts,at:Date.now(),status:'pending'};
  push(c,msg);S.pending=[];
}

function push(c,msg){
  const textForMod=[msg.body,msg.payload&&msg.payload.note,msg.payload&&msg.payload.cond].filter(Boolean).join('\n');
  const mod=moderate(textForMod);
  msg.verdict=mod.verdict;msg.flags=mod.flags;
  if(mod.verdict!=='BLOCK'&&msg.body)msg.body=moderate(msg.body).clean;
  if(mod.verdict==='WARN')msg.tip=mod.tip;
  c.messages.push(msg);
  if(mod.verdict==='BLOCK'){msg.status='blocked';render();toast('Message not delivered: blocked by safety rules','err');trackOffender(c);return}
  const role=myRole(c);
  c.awaiting=role==='buyer'?'seller':'buyer';c.awaitingSince=c.awaiting===(role==='buyer'?'seller':'buyer')&&c.awaitingSince&&c._lastSender===me()?c.awaitingSince:Date.now();c._lastSender=me();
  render();
  // ✓ stored → ✓✓ recipient device online → blue ✓✓ recipient opened the chat
  setTimeout(()=>{if(msg.status==='pending'){msg.status='sent';render()}},350);
  if(other(c)==='viktor'||c.status!=='OPEN')return;
  setTimeout(()=>{if(msg.status==='sent'){msg.status='delivered';render()}},1300);
  if(other(c)==='giorgi')return; // Giorgi is offline: stays at ✓✓ — use "Simulate 24 h"
  setTimeout(()=>{if(msg.status==='delivered'){msg.status='read';render()}},2800);
  if(msg.kind==='TEXT'||msg.kind==='ATTACHMENT')autoReply(c,msg);
}

const REPLIES={seller:['Utilities run about €85 a month. I put last year\'s bills in the files.','Sure, see you at the viewing. I\'ll bring the keys and the inventory list.','Got it, thank you!'],
  buyer:['Thanks, that helps a lot.','Great, I\'ll send a viewing request.','Could you share the lease draft?']};
function autoReply(c){
  const who=other(c);const side=c.buyer===who?'buyer':'seller';
  setTimeout(()=>{S.typing[c.id]=true;render()},3300);
  setTimeout(()=>{S.typing[c.id]=false;const pool=REPLIES[side];const body=pool[(c._r=(c._r||0)+1)%pool.length];
    c.messages.push({id:id(),from:who,kind:'TEXT',body,at:Date.now(),status:S.active===c.id&&S.role!=='support'?'read':'delivered',verdict:'ALLOW'});
    c.awaiting=side==='buyer'?'seller':'buyer';c.awaitingSince=Date.now();c._lastSender=who;render()},5600);
}

function trackOffender(c){
  const blocked=c.messages.filter(m=>m.from===me()&&m.verdict==='BLOCK').length;
  if(blocked>=3&&!reports.some(r=>r.auto&&r.against===me())){reports.unshift({id:'r'+(++seq),conv:c.id,reporter:'Safety system',against:me(),reason:'FRAUD',auto:true,comment:blocked+' messages blocked in 24 h',status:'OPEN',sev:5});toast('3 blocked messages: an automatic report went to Support','warn')}
}

function answer(c,mid,status,chosen){
  const m=c.messages.find(x=>x.id===mid);m.payload.status=status;if(chosen)m.payload.chosen=chosen;
  const isMeeting=m.kind==='MEETING_REQUEST';
  const body=isMeeting?(status==='ACCEPTED'?`Viewing confirmed for ${slot(chosen)}. We will remind both of you 2 hours before.`:'The owner could not make these times. Suggest new slots.')
    :(status==='ACCEPTED'?'Terms accepted. Pay the deposit only through the secure checkout.':'Terms declined.');
  c.messages.push({id:id(),from:null,kind:'SYSTEM',body,at:Date.now()});
  if(myRole(c)==='seller'){c.awaiting='buyer';c.awaitingSince=Date.now()}
  render();
}

function fastForward(c){
  const sim=similarFor[c.listing]||[];
  c.messages.push({id:id(),from:null,kind:'SYSTEM',audience:'buyer',body:`The owner hasn't replied for 24 hours. We've sent them a reminder. Meanwhile, here are similar options nearby.`,similar:sim,at:Date.now()});
  c.awaitingSince=Date.now()-24*H;
  toast(`Reminder sent to ${users[c.seller].name}: “${users[c.buyer].name.split(' ')[0]} is waiting 24 h for your reply”`,'warn');
  render();
}

// ---------- dialogs ----------
const modal=document.getElementById('modal');
function dialog(title,body,onBind){
  modal.innerHTML=`<div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><button class="x" aria-label="Close">✕</button>${body}</div></div>`;
  const close=()=>modal.innerHTML='';
  modal.querySelector('.scrim').onclick=e=>{if(e.target.classList.contains('scrim'))close()};
  modal.querySelector('.x').onclick=close;
  document.onkeydown=e=>{if(e.key==='Escape')close()};
  onBind(modal.querySelector('.dlg'),close);
  const first=modal.querySelector('input,select,textarea,button.btn');first&&first.focus();
}

function reportDialog(msg){
  const c=conv(S.active);
  dialog(msg?'Report message':'Report '+users[other(c)].name,`${msg&&msg.body?`<div class="quote">“${esc(msg.body.slice(0,200))}”</div>`:''}
   <div class="reasons" role="radiogroup">${REASONS.map(([v,l],i)=>`<label><input type="radio" name="reason" value="${v}" ${i===1?'checked':''}> ${l}</label>`).join('')}</div>
   <div class="field"><label for="rc">Details (optional)</label><textarea id="rc" rows="2" maxlength="1000"></textarea></div>
   <button class="btn red" id="rs">Send report</button>`,(d,close)=>{
    d.querySelector('#rs').onclick=()=>{const reason=d.querySelector('input[name=reason]:checked').value;
      const against=msg?msg.from:other(c);
      if(reports.some(r=>!r.auto&&r.reporterId===me()&&r.msg===(msg&&msg.id)&&r.status==='OPEN')){toast('You have already reported this','warn');close();return}
      reports.push({id:'r'+(++seq),conv:c.id,reporter:users[me()].name,reporterId:me(),against,msg:msg&&msg.id,reason,comment:d.querySelector('#rc').value,status:'OPEN',sev:['FRAUD','PHISHING','HARASSMENT'].includes(reason)?3:1});
      reports.sort((a,b)=>b.sev-a.sev);
      close();toast('Report sent. Support reviews reports within 24 hours. Until then, don\'t send money or documents to this person.')}});
}

function meetingDialog(){
  const c=conv(S.active);const local=t=>{const d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
  dialog('Request a time',`<div class="seg" id="mt">${[['SHOWING','Viewing'],['MEETING','Meeting'],['RESERVATION','Reservation']].map(([v,l],i)=>`<button data-v="${v}" aria-pressed="${i===0}">${l}</button>`).join('')}</div>
   <div class="field"><label for="s1">Option 1</label><input type="datetime-local" id="s1" value="${local(day(2,18,0))}"></div>
   <div class="field"><label for="s2">Option 2</label><input type="datetime-local" id="s2" value="${local(day(3,10,30))}"></div>
   <div class="field"><label for="s3">Option 3 (optional)</label><input type="datetime-local" id="s3"></div>
   <div class="field"><label for="mn">Note</label><input id="mn" placeholder="e.g. I can come with my partner"></div>
   <button class="btn" id="ms">Send request</button>`,(d,close)=>{
    let type='SHOWING';d.querySelectorAll('#mt button').forEach(b=>b.onclick=()=>{type=b.dataset.v;d.querySelectorAll('#mt button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
    d.querySelector('#ms').onclick=()=>{const slots=['#s1','#s2','#s3'].map(s=>d.querySelector(s).value).filter(Boolean).map(v=>new Date(v).getTime());
      if(!slots.length)return;close();
      push(c,{id:id(),from:me(),kind:'MEETING_REQUEST',payload:{type,slots,note:d.querySelector('#mn').value,status:'PENDING'},at:Date.now(),status:'pending'})}});
}

function offerDialog(){
  const c=conv(S.active);const l=listings[c.listing];
  dialog('Send terms',`<div class="grid2"><div class="field"><label for="op">Price (${l.cur})</label><input id="op" type="number" value="${l.price}"></div>
   <div class="field"><label for="od">Deposit</label><input id="od" type="number" value="${l.type==='RENT'?l.price:Math.round(l.price*.1)}"></div>
   ${l.type==='RENT'?`<div class="field"><label for="ot">Term, months</label><input id="ot" type="number" value="12"></div>`:''}
   <div class="field"><label for="om">${l.type==='RENT'?'Move-in':'Handover'}</label><input id="om" type="date"></div></div>
   <div class="field"><label for="oc">Conditions</label><textarea id="oc" rows="2" placeholder="Pets, utilities, furniture…"></textarea></div>
   <button class="btn" id="os">Send terms</button>`,(d,close)=>{
    d.querySelector('#os').onclick=()=>{const v=s=>d.querySelector(s)?.value;close();
      push(c,{id:id(),from:me(),kind:'OFFER',payload:{price:+v('#op'),cur:l.cur,deposit:+v('#od')||0,term:+v('#ot')||0,moveIn:v('#om')||null,cond:v('#oc'),status:'PENDING'},at:Date.now(),status:'pending'})}});
}

function payDialog(c){
  dialog('Secure reservation deposit',`<p style="margin:0;color:var(--muted)">The deposit is held by the platform and released to the owner only after you confirm move-in. In the real app the Stripe payment form opens here.</p>
   <button class="btn" id="pp">Simulate successful payment</button>`,(d,close)=>{d.querySelector('#pp').onclick=()=>{close();listings[c.listing].status='RESERVED';
     c.messages.push({id:id(),from:null,kind:'SYSTEM',body:'Deposit received and held securely by the platform. The property is now reserved.',at:Date.now()});render()}});
}

// ---------- support ----------
function bindSupport(){
  shell.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.report=b.dataset.r;render()});
  shell.querySelectorAll('[data-sa]').forEach(b=>b.onclick=()=>{
    const r=reports.find(x=>x.id===S.report);const c=conv(r.conv);const a=b.dataset.sa;
    if(a==='block'){
      dialog('Block '+users[r.against].name+'?',`<p style="margin:0;color:var(--muted)">Their conversations will be frozen, listings closed and live sessions disconnected. Both sides see a warning in the chat.</p><button class="btn red" id="cb">Block user</button>`,(d,close)=>{
        d.querySelector('#cb').onclick=()=>{close();
          convs.filter(x=>x.buyer===r.against||x.seller===r.against).forEach(x=>{x.status='BLOCKED';listings[x.listing].status='CLOSED';x.awaiting=null;
            x.messages.push({id:id(),from:null,kind:'SYSTEM',body:'This user was blocked for violating platform rules. Do not send money or documents to them.',at:Date.now()})});
          reports.filter(x=>x.against===r.against&&x.status==='OPEN').forEach(x=>{x.status='RESOLVED';x.resolution='User blocked'});
          toast(users[r.against].name+' blocked');render()}});
      return}
    if(a==='hide'){c.messages.filter(m=>m.from===r.against&&m.flags&&m.flags.length).forEach(m=>m.hidden=true)}
    r.status=a==='dismiss'?'DISMISSED':'RESOLVED';r.resolution={dismiss:'Dismissed',warn:'User warned',hide:'Flagged messages hidden'}[a];
    toast(r.resolution);render()});
}

render();
})();
