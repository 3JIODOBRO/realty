<title>Realty Deal Chat</title>
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Realty Deal Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600&display=swap">
<style>
:root{
  --bg:#eef1ee; --surface:#ffffff; --sunken:#f4f6f3; --line:#dfe4df;
  --fg:#18201c; --muted:#5d6a63; --faint:#8d9891;
  --brand:#1d6b52; --brand-ink:#ffffff; --brand-soft:#e1efe8; --brand-strong:#134a39;
  --read:#2f7fe0; --warn-bg:#fff4dc; --warn-fg:#7a4f00; --warn-line:#f1d595;
  --danger:#c8382c; --danger-soft:#fdebe9;
  --mine:#1d6b52; --mine-fg:#ffffff; --theirs:#ffffff;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(16,40,30,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#161d1a; --sunken:#1c2521; --line:#27322d;
  --fg:#e7eee9; --muted:#9fb0a7; --faint:#71817a;
  --brand:#3fa883; --brand-ink:#08140f; --brand-soft:#173329; --brand-strong:#8fdcbd;
  --read:#5ea4ff; --warn-bg:#33280f; --warn-fg:#f3cf7c; --warn-line:#5a4618;
  --danger:#ff6b5e; --danger-soft:#3a1714;
  --mine:#2c8a68; --mine-fg:#ffffff; --theirs:#1f2925;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#161d1a; --sunken:#1c2521; --line:#27322d;
  --fg:#e7eee9; --muted:#9fb0a7; --faint:#71817a;
  --brand:#3fa883; --brand-ink:#08140f; --brand-soft:#173329; --brand-strong:#8fdcbd;
  --read:#5ea4ff; --warn-bg:#33280f; --warn-fg:#f3cf7c; --warn-line:#5a4618;
  --danger:#ff6b5e; --danger-soft:#3a1714;
  --mine:#2c8a68; --mine-fg:#ffffff; --theirs:#1f2925;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
a{color:var(--brand-strong)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:10px}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:17px;letter-spacing:-.02em;color:var(--brand-strong)}
.logo small{font-family:var(--body);font-size:11px;font-weight:500;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
.toplink{margin-left:auto;text-decoration:none}
.authbox{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.authbox input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:13px;width:170px}
.authbox .who-me{font-size:13px;color:var(--muted)}

.shell{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.inbox{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.inbox h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0;padding:14px 14px 8px}
.chips{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.convs{overflow-y:auto;flex:1;min-height:0}
.conv{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.conv:hover{background:var(--sunken)}
.conv[aria-current="true"]{background:var(--brand-soft)}
.thumb{width:48px;height:48px;border-radius:9px;position:relative;overflow:hidden}
.thumb span{position:absolute;inset:auto 0 0;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:center;color:#fff;background:rgba(0,0,0,.45)}
.row{display:flex;align-items:baseline;gap:6px;min-width:0}
.row .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.last{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);min-width:0}
.last .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.last.unread .txt{color:var(--fg);font-weight:600}
.badge{background:var(--brand);color:var(--brand-ink);border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;font-variant-numeric:tabular-nums}
.waiting{font-size:11px;color:var(--warn-fg);font-weight:600;margin-top:3px}

.chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.back{display:none;font-size:20px;line-height:1;padding:4px 6px;color:var(--muted)}
.who{flex:1;min-width:0}
.who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--faint);font-size:12px}
.ghost{font-size:12.5px;padding:6px 10px;border-radius:8px;color:var(--muted);white-space:nowrap}
.ghost:hover{background:var(--sunken);color:var(--fg)}
.ghost.danger{color:var(--danger)}
.ghost.danger:hover{background:var(--danger-soft)}

.prop{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunken)}
.prop .ph{height:58px;border-radius:9px}
.prop .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prop .pm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--brand-soft);color:var(--brand-strong);margin-right:6px}
.btn{background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:13px;padding:8px 12px;border-radius:9px;white-space:nowrap;display:inline-block}
.btn:hover{filter:brightness(1.08)}
.btn.line{background:transparent;color:var(--brand-strong);border:1.5px solid var(--brand)}
.btn.red{background:var(--danger);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}

.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.notice{align-self:center;max-width:420px;text-align:center;font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.m{display:flex;flex-direction:column;max-width:min(76%,520px)}
.m.mine{align-self:flex-end;align-items:flex-end}
.m.theirs{align-self:flex-start;align-items:flex-start}
.bubble{position:relative;padding:8px 12px 6px;border-radius:16px;box-shadow:var(--shadow);overflow-wrap:anywhere}
.mine .bubble{background:var(--mine);color:var(--mine-fg);border-bottom-right-radius:5px}
.theirs .bubble{background:var(--theirs);border-bottom-left-radius:5px}
.m.blocked .bubble{background:var(--danger-soft);color:var(--fg);outline:1px solid var(--danger)}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;margin-top:2px;opacity:.75;font-variant-numeric:tabular-nums}
.ticks{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:4px;padding:1px 2px;height:14px}
.ticks svg{width:18px;height:11px;color:#8d9891}
.ticks.read svg{color:var(--read)}
.ticks.pending svg{width:12px;height:12px}
.bang{width:15px;height:15px;border-radius:50%;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.flag{position:absolute;top:4px;right:-26px;opacity:0;color:var(--faint);padding:3px;border-radius:6px}
.m.theirs:hover .flag,.flag:focus-visible{opacity:1}
.flag:hover{color:var(--danger);background:var(--danger-soft)}
.tip{max-width:100%;font-size:12px;background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line);border-radius:10px;padding:6px 10px;margin-bottom:4px}
.blocknote{font-size:11.5px;color:var(--danger);margin-top:3px;text-align:right;max-width:340px}
.sys{align-self:center;max-width:440px;background:var(--brand-soft);color:var(--brand-strong);border-radius:12px;padding:8px 12px;font-size:12.5px;text-align:center}
.card{min-width:220px}
.card .k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.8;margin-bottom:5px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:12.5px;font-variant-numeric:tabular-nums}
.card dt{opacity:.7}.card dd{margin:0;font-weight:600}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.slots li{display:flex;justify-content:space-between;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.slots li.chosen{font-weight:700;text-decoration:underline}
.mini{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--brand);color:var(--brand-ink)}
.mini.out{background:transparent;border:1px solid currentColor;color:inherit}
.state{font-size:11px;font-weight:600;margin-top:5px;opacity:.85}

.quick{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto}
.quick button{flex:none;font-size:12px;padding:5px 11px;border-radius:999px;background:var(--brand-soft);color:var(--brand-strong);border:1px solid transparent}
.quick button:hover{border-color:var(--brand)}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;resize:none;border:0;border-radius:12px;background:var(--sunken);padding:10px 12px;min-height:42px;max-height:120px}
.composer textarea:focus{outline:2px solid var(--brand)}
.hint{font-size:11px;color:var(--faint);padding:0 14px 8px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunken);border-radius:9px;padding:3px;gap:2px}
.seg button{font-size:12px;padding:5px;border-radius:7px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:12.5px}
.empty{padding:28px 14px;text-align:center;color:var(--faint);font-size:13px}

.scrim{position:fixed;inset:0;background:rgba(10,20,15,.42);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.dlg{background:var(--surface);border-radius:16px;padding:18px;width:min(440px,100%);max-height:90%;overflow-y:auto;display:grid;gap:12px}
.dlg h3{margin:0;font-size:16px}
.dlg .x{justify-self:end;margin-top:-30px;color:var(--faint);font-size:18px}
.reasons{display:grid;gap:2px}
.reasons label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13.5px;cursor:pointer}
.reasons label:hover{background:var(--sunken)}
.reasons input{accent-color:var(--brand)}
.quote{font-size:12.5px;background:var(--sunken);border-radius:9px;padding:8px 10px;color:var(--muted)}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toasts{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:50;max-width:min(360px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--surface);border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.18);text-align:left}
.toast.warn{background:#b7791f;color:#fff}.toast.err{background:var(--danger);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .shell .inbox{display:none}
  .shell.list .inbox{display:flex}
  .shell.list .chat{display:none}
  .back{display:block}
  .prop{grid-template-columns:60px minmax(0,1fr)}
  .prop .ph{height:46px}
  .prop .cta{grid-column:1/-1}
  .flag{right:-22px}
  .legend{display:none}
  .toplink{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){
  .m{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

<script>
(function(){

// ---------- moderation ----------
const PROF=[/\bf+u+c+k+\w*/gi,/\bs+h+i+t+\w*/gi,/\bb+i+t+c+h+\w*/gi,/(?<![а-яё])[хx][уy][йиеёяю]\S*/gi,/(?<![а-яё])бл[яa]\S*/gi,/(?<![а-яё])пизд\S*/gi,/(?<![а-яё])[её]б[аауоы]\S*/gi,/(?<![а-яё])сук[аи](?![а-яё])/gi];
const URL_RE=/\b((?:https?:\/\/|www\.)[^\s<>"']+|[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|net|org|ru|xyz|top|click|link|info|online|site|shop|app|biz|ge|io|me|co|ly|gl|gd|at|cc|to|pw|ws|su|tk)(?:\/[^\s<>"']*)?)(?![\w-])/gi;
const SHORT=['bit.ly','tinyurl.com','t.co','goo.gl','cutt.ly','is.gd','rb.gy','clck.ru'];

const FRAUD=[
 [/western\s*union|moneygram|золотая\s*корона/i,'offplatform_transfer',2],
 [/\b(usdt|bitcoin|btc|crypto|tether)\b|крипт|биткоин/i,'crypto_payment',2],
 [/(deposit|prepay\w*|advance|предоплат\w*|задат\w*|аванс\w*).{0,40}(before|without|до|без).{0,20}(view\w*|see\w*|showing|просмотр\w*|осмотр\w*)/i,'prepay_before_viewing',2],
 [/(i\s*am|i'm|я)\s*(abroad|out of the country|за\s*границ\w*).{0,80}(keys?|ключ\w*)/i,'absent_owner_keys_by_mail',2],
 [/(pay|transfer|send|переве\w*|оплат\w*).{0,30}(outside|directly|напрямую|на\s*карт\w*)/i,'pay_outside_platform',1],
 [/(whats\s*app|telegram|телеграм\w*|viber|вотсап\w*|ватсап\w*)/i,'move_off_platform',1],
 [/\b(cvv|cvc|sms[\s-]*code|one[\s-]*time\s*code)\b|код\s*из\s*смс|смс[\s-]*код/i,'credential_request',3],
 [/(urgent|срочно|today only|other (buyers|tenants) waiting|много желающих)/i,'pressure',1]];
function luhn(n){let s=0,a=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(a){d*=2;if(d>9)d-=9}s+=d;a=!a}return s%10===0}
function moderate(text){
  const flags=new Set();let clean=text,score=0,hard=false;
  if(!text||!text.trim()) return {verdict:'ALLOW',flags:[],clean:text};
  for(const re of PROF){re.lastIndex=0;if(re.test(clean)){flags.add('profanity');clean=clean.replace(re,m=>m[0]+'*'.repeat(Math.max(m.length-1,2)))}re.lastIndex=0}
  for(const m of text.matchAll(URL_RE)){let h='';try{h=new URL(m[0].startsWith('http')?m[0]:'http://'+m[0]).hostname.toLowerCase()}catch(e){}
    if(!h||SAFE.some(d=>h===d||h.endsWith('.'+d)))continue;
    if(SHORT.includes(h)){flags.add('phishing_shortener');hard=true}
    else if(/^\d{1,3}(\.\d{1,3}){3}$/.test(h)){flags.add('phishing_ip_url');hard=true}
    else if(h.includes('xn--')){flags.add('phishing_punycode');hard=true}

    else if(/(verify|confirm|secure|login|payment|wallet|refund|account)/i.test(m[0])){flags.add('phishing_suspicious_link');score+=2}
    else flags.add('external_link')}
  for(const m of text.matchAll(/(?:\d[ -]?){13,19}/g)){const d=m[0].replace(/\D/g,'');if(d.length>=13&&d.length<=19&&luhn(d)){flags.add('card_number');hard=true}}
  for(const [re,f,w] of FRAUD){if(re.test(text)){flags.add(f);score+=w}}
  if(flags.has('credential_request'))hard=true;
  let verdict='ALLOW';if(hard||score>=4)verdict='BLOCK';else if(score>=1||flags.has('profanity')||flags.has('external_link'))verdict='WARN';
  let tip;
  if(verdict==='WARN'){
    if(['prepay_before_viewing','pay_outside_platform','offplatform_transfer','crypto_payment'].some(f=>flags.has(f)))tip='Never pay a deposit before viewing or outside the platform. Use the secure reservation deposit: the money is held until you confirm move-in.';
    else if(flags.has('move_off_platform'))tip='Keep the conversation here. Messages, documents and agreements in this chat can be reviewed by Support if something goes wrong.';
    else if(flags.has('external_link')||flags.has('phishing_suspicious_link'))tip='This message contains an external link. Do not enter passwords or card details on sites you reached from a chat.';

  }
  return {verdict,flags:[...flags],clean,tip};

 {t:'Utilities',b:'Utilities are not included: on average about 85 a month (electricity, water, internet).'},
 {t:'Pets',b:'Small pets are fine with an extra amount added to the deposit.'},
 {t:'Documents needed',b:'To proceed I will need: ID, proof of income for the last 3 months and, if you have one, a reference from your previous landlord.'},
];

// ---------- state ----------
const S={user:null,convs:[],listings:{},active:null,filter:'all',mobileList:false,channel:null,rendered:null};
let tmp=0;
const me=()=>S.user&&S.user.id;
const conv=id=>S.convs.find(c=>c.id===id);
const listingOf=c=>S.listings[c.listing]||{id:c.listing,title:'Listing removed'};
const myRole=c=>listingOf(c).user_id===me()?'seller':'buyer';

// ---------- helpers ----------
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nameOf=email=>email?email.split('@')[0]:'User';
const fmtPrice=p=>p?new Intl.NumberFormat('ru-RU').format(p):'';
const tm=t=>new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const slot=t=>new Date(t).toLocaleString([], {weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const rel=t=>{const m=Math.round((Date.now()-t)/60000);if(m<1)return'now';if(m<60)return m+' min';const h=Math.round(m/60);if(h<24)return h+' h';return new Date(t).toLocaleDateString([], {day:'numeric',month:'short'})};
const day=(d,h,mi)=>{const x=new Date(Date.now()+d*24*H);x.setHours(h,mi||0,0,0);return x.getTime()};
const hueOf=id=>(Number(id)*47)%360;
const cleanUrl=u=>String(u).replace(/['"()\\\s]/g,'');
const thumbBg=l=>l.photo_url?`center/cover no-repeat url('${cleanUrl(l.photo_url)}')`:`linear-gradient(145deg,hsl(${hueOf(l.id)} 38% 52%),hsl(${(hueOf(l.id)+30)%360} 35% 32%))`;
function toast(text,tone){const el=document.createElement('button');el.className='toast '+(tone||'');el.textContent=text;el.onclick=()=>el.remove();document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),6500)}

// ---------- data from Supabase ----------
const keyOf=(listingId,otherId)=>listingId+'|'+otherId;
function rowToMsg(r){return {id:r.id,sender:r.sender_id,receiver:r.receiver_id,kind:r.kind||'TEXT',body:r.text||null,payload:r.payload,at:Date.parse(r.created_at),read:!!r.read,status:r.read?'read':'sent'}}
function ensureConv(listingId,otherId,otherEmail){
  const id=keyOf(listingId,otherId);let c=conv(id);
  if(!c){c={id,listing:listingId,other:otherId,otherEmail:otherEmail||null,messages:[]};S.convs.push(c)}
  if(!c.otherEmail&&otherEmail)c.otherEmail=otherEmail;
  return c;
}
function addRow(r){
  const mine=r.sender_id===me();
  const c=ensureConv(r.listing_id,mine?r.receiver_id:r.sender_id,mine?r.receiver_email:r.sender_email);
  const m=rowToMsg(r);const i=c.messages.findIndex(x=>x.id===r.id);
  if(i>=0)c.messages[i]=m;else{c.messages.push(m);c.messages.sort((a,b)=>a.at-b.at)}
  return c;
}
async function loadListings(ids){
  ids=ids.filter(id=>!S.listings[id]);if(!ids.length)return;
  const {data}=await db.from('listings').select('*').in('id',ids);
  (data||[]).forEach(l=>S.listings[l.id]=l);
}
async function loadAll(){
  const {data,error}=await db.from('messages').select('*').order('created_at');
  if(error){toast('Ошибка: '+error.message,'err');return}
  S.convs=[];data.forEach(addRow);
  const lid=new URLSearchParams(location.search).get('listing');
  await loadListings([...new Set(S.convs.map(c=>c.listing).concat(lid?[Number(lid)]:[]))]);
  if(lid){
    const l=S.listings[lid];
    if(!l)toast('Объявление не найдено','err');
    else if(l.user_id===me())toast('Это ваше объявление: покупатели будут писать вам сюда','warn');
    else{const c=ensureConv(l.id,l.user_id,l.owner_email);S.active=c.id;S.mobileList=false}
    history.replaceState(null,'',location.pathname);
  }
  if(!conv(S.active))S.active=(sortedConvs()[0]||{}).id||null;
  render();markRead();
}
function subscribe(){
  if(S.channel)db.removeChannel(S.channel);
  S.channel=db.channel('messages-'+me())
    .on('postgres_changes',{event:'*',schema:'public',table:'messages'},async p=>{
      const r=p.new;if(!r||!r.id)return;
      if(r.sender_id!==me()&&r.receiver_id!==me())return;
      const c=addRow(r);await loadListings([r.listing_id]);
      if(p.eventType==='INSERT'&&r.sender_id!==me()){
        if(c.id===S.active&&document.visibilityState==='visible')markRead();
        else toast('Новое сообщение от '+nameOf(r.sender_email));
      }
      render();
    }).subscribe();
}
async function markRead(){
  const c=conv(S.active);if(!c)return;
  const ids=c.messages.filter(m=>m.receiver===me()&&!m.read&&typeof m.id==='number').map(m=>m.id);
  if(!ids.length)return;
  c.messages.forEach(m=>{if(ids.includes(m.id))m.read=true});
  render();
  await db.from('messages').update({read:true}).in('id',ids);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')markRead()});

// ---------- auth ----------
const authbox=document.getElementById('authbox');
function showLoginForm(){
  authbox.innerHTML=`<input id="authEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="authPass" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
    <button class="btn" id="btnLogin">Войти</button><button class="btn line" id="btnSignup">Регистрация</button>`;
  const v=id=>document.getElementById(id).value.trim();
  document.getElementById('btnLogin').onclick=async()=>{
    if(!v('authEmail')||!v('authPass'))return alert('Введите email и пароль');
    const {error}=await db.auth.signInWithPassword({email:v('authEmail'),password:v('authPass')});
    if(error)alert('Ошибка: '+error.message)};
  document.getElementById('btnSignup').onclick=async()=>{
    if(!v('authEmail')||!v('authPass'))return alert('Введите email и пароль');
    const {error}=await db.auth.signUp({email:v('authEmail'),password:v('authPass')});
    if(error)alert('Ошибка: '+error.message)};
}
function showUser(u){
  authbox.innerHTML=`<span class="who-me">👤 ${esc(u.email)}</span><button class="ghost" id="btnLogout">Выйти</button>`;
  document.getElementById('btnLogout').onclick=()=>db.auth.signOut();
}
db.auth.onAuthStateChange((event,session)=>{
  const u=session?session.user:null;
  const changed=(u&&u.id)!==(S.user&&S.user.id);
  S.user=u;u?showUser(u):showLoginForm();
  if(!changed)return;
  S.convs=[];S.active=null;
  if(u){setTimeout(()=>{loadAll();subscribe()},0)}
  else{if(S.channel){db.removeChannel(S.channel);S.channel=null}render()}
});

// ---------- render ----------
const shell=document.getElementById('shell');
const lastAt=c=>c.messages.length?c.messages[c.messages.length-1].at:Date.now();
function awaiting(c){const ms=c.messages.filter(m=>m.kind!=='SYSTEM'&&m.status!=='blocked');const last=ms[ms.length-1];if(!last)return null;return {who:last.sender===me()?'them':'me',since:last.at}}
const unread=c=>c.messages.filter(m=>m.receiver===me()&&!m.read).length;
function sortedConvs(){return S.convs.filter(c=>S.filter==='all'||(awaiting(c)||{}).who==='me').sort((a,b)=>lastAt(b)-lastAt(a))}

function render(){
  const ta=shell.querySelector('#text');const draft=ta?ta.value:'';const hadFocus=ta&&document.activeElement===ta;
  if(!S.user){shell.className='shell';shell.innerHTML='<div class="empty" style="grid-column:1/-1;align-self:center">Войдите или зарегистрируйтесь вверху страницы, чтобы видеть свои сообщения.</div>';S.rendered=null;return}
  if(!S.convs.length){shell.className='shell';shell.innerHTML='<div class="empty" style="grid-column:1/-1;align-self:center">Пока нет переписок. Откройте <a href="listings.html">объявления</a> и нажмите «Написать автору».</div>';S.rendered=null;return}
  shell.className='shell'+(S.mobileList?' list':'');
  shell.innerHTML=renderInbox(sortedConvs())+renderChat(conv(S.active));
  bindChat();
  const box=shell.querySelector('.msgs');if(box)box.scrollTop=box.scrollHeight;
  const nta=shell.querySelector('#text');
  if(nta&&S.rendered===S.active){nta.value=draft;if(hadFocus)nta.focus()}
  S.rendered=S.active;
}

function preview(m){
  if(m.kind==='MEETING_REQUEST')return'📅 Viewing request';
  if(m.kind==='OFFER')return'📝 Terms';
  if(m.status==='blocked')return'Not delivered: '+(m.body||'');
  return m.body||'';
}
function renderInbox(list){
  const f=S.filter;const waiting=S.convs.filter(c=>(awaiting(c)||{}).who==='me').length;
  return `<aside class="inbox"><h2>Conversations</h2>
   <div class="chips"><button class="chip" data-f="all" aria-pressed="${f==='all'}">All</button><button class="chip" data-f="wait" aria-pressed="${f==='wait'}">Needs my reply${waiting?' · '+waiting:''}</button></div>
   <div class="convs">${list.length?list.map(c=>{const l=listingOf(c);const last=c.messages[c.messages.length-1];const u=unread(c);const aw=awaiting(c);
    const prev=last?(last.sender===me()&&last.kind!=='SYSTEM'?ticks(last.status):'')+'<span class="txt">'+esc(preview(last))+'</span>':'<span class="txt">New conversation</span>';
    return `<button class="conv" data-c="${esc(c.id)}" aria-current="${c.id===S.active}">
      <div class="thumb" style="background:${thumbBg(l)}">${myRole(c)==='seller'?'<span>Owner</span>':''}</div>
      <div style="min-width:0"><div class="row"><span class="name">${esc(nameOf(c.otherEmail))}</span><span class="when">${last?rel(last.at):''}</span></div>
      <div class="sub">${esc(l.title)}${l.price?' · '+fmtPrice(l.price):''}</div>
      <div class="last ${u?'unread':''}">${prev}${u?`<span class="badge">${u}</span>`:''}</div>
      ${aw&&aw.who==='me'?`<div class="waiting">⏱ Waiting for your reply · ${rel(aw.since)}</div>`:''}</div></button>`}).join(''):'<div class="empty">Nothing here</div>'}</div></aside>`;
}

function renderChat(c){
  if(!c)return '<section class="chat"><div class="empty">Select a conversation</div></section>';
  const l=listingOf(c),role=myRole(c);
  const cta=role==='buyer'?`<button class="btn" data-act="meeting">Request viewing</button>`:`<button class="btn line" data-act="offer">Send terms</button>`;
  return `<section class="chat">
   <div class="chathead"><button class="back" data-act="list" aria-label="Back to conversations">‹</button>
    <div class="who"><b>${esc(nameOf(c.otherEmail))}</b><small>${role==='buyer'?'Owner of this property':'Interested in your listing'}</small></div>
    <button class="ghost danger" data-act="reportUser">Report user</button></div>
   <div class="prop"><div class="ph" style="background:${thumbBg(l)}"></div>
    <div style="min-width:0"><div><span class="pill">Available</span></div><div class="t">${esc(l.title)}</div>
    <div class="pm">${l.price?fmtPrice(l.price)+' · ':''}${esc(l.address||'')}</div></div><div class="cta">${cta}</div></div>
   <div class="msgs"><div class="notice">🔒 Keep payments and documents inside this chat. That is what lets Support protect you.</div>
    ${c.messages.map(m=>renderMsg(c,m)).join('')}</div>
   ${role==='seller'?`<div class="quick">${templates.map((t,i)=>`<button data-tpl="${i}">${esc(t.t)}</button>`).join('')}</div>`:''}
   <div class="composer"><textarea id="text" rows="1" placeholder="Write a message…" aria-label="Message"></textarea>
    <button class="btn" data-act="send">Send</button></div>
   <div class="hint">Чтобы проверить переписку, откройте сайт во втором браузере (или в режиме инкогнито) под другим аккаунтом.</div>
  </section>`;
}

function renderMsg(c,m){
  if(m.kind==='SYSTEM')return `<div class="sys">🛡️ ${esc(m.body)}</div>`;
  const isMine=m.sender===me();
  let tip='';
  if(!isMine&&m.body){const r=moderate(m.body);if(r.verdict==='WARN'&&r.tip)tip=`<div class="tip" role="alert"><b>Safety tip:</b> ${esc(r.tip)}</div>`}
  let inner='';const p=m.payload;
  if(m.kind==='MEETING_REQUEST'&&p){const canAnswer=!isMine&&p.status==='PENDING';
    inner+=`<div class="card"><div class="k">📅 ${p.type==='SHOWING'?'Viewing':p.type==='MEETING'?'Meeting':'Reservation'} request</div><ul class="slots">${(p.slots||[]).map(s=>`<li class="${p.chosen===s?'chosen':''}"><span>${slot(s)}</span>${canAnswer?`<button class="mini" data-slot="${m.id}|${s}">Confirm</button>`:''}</li>`).join('')}</ul>
     ${p.note?`<div class="state" style="font-weight:400">${esc(p.note)}</div>`:''}<div class="state">${{PENDING:'Waiting for answer',ACCEPTED:'✓ Confirmed',DECLINED:'✕ Declined'}[p.status]||''}</div>
     ${canAnswer?`<button class="mini out" style="margin-top:5px" data-decline="${m.id}">None of these work</button>`:''}</div>`}
  if(m.kind==='OFFER'&&p){const canAnswer=!isMine&&p.status==='PENDING';
    inner+=`<div class="card"><div class="k">📝 Terms</div><dl><dt>Price</dt><dd>${fmtPrice(p.price)}</dd>${p.deposit?`<dt>Deposit</dt><dd>${fmtPrice(p.deposit)}</dd>`:''}${p.term?`<dt>Term</dt><dd>${p.term} months</dd>`:''}${p.moveIn?`<dt>Move-in</dt><dd>${new Date(p.moveIn).toLocaleDateString()}</dd>`:''}</dl>
     ${p.cond?`<div class="state" style="font-weight:400">${esc(p.cond)}</div>`:''}<div class="state">${{PENDING:'Waiting for answer',ACCEPTED:'✓ Accepted',DECLINED:'✕ Declined'}[p.status]||''}</div>
     ${canAnswer?`<div style="display:flex;gap:6px;margin-top:6px"><button class="mini" data-accept="${m.id}">Accept</button><button class="mini out" data-reject="${m.id}">Decline</button></div>`:''}
     ${!isMine&&p.status==='ACCEPTED'&&p.deposit?`<button class="mini" style="margin-top:6px" data-pay="${m.id}">Pay secure deposit</button>`:''}</div>`}
  if(m.body)inner+=`<div>${esc(m.body)}</div>`;
  const flag=!isMine?`<button class="flag" data-report="${m.id}" title="Report message" aria-label="Report message">${FLAG}</button>`:'';
  const note=isMine&&m.status==='blocked'?`<div class="blocknote">Not delivered: this message contains a link, payment request or personal data our safety rules don't allow. Use the built-in terms and secure deposit instead.</div>`:'';
  return `<div class="m ${isMine?'mine':'theirs'} ${isMine&&m.status==='blocked'?'blocked':''}">${tip}<div class="bubble">${flag}${inner}<div class="meta">${tm(m.at)} ${isMine?ticks(m.status):''}</div></div>${note}</div>`;
}

// ---------- events ----------
function openConv(id){S.active=id;S.mobileList=false;render();markRead()}
function bindChat(){
  shell.querySelectorAll('.conv').forEach(b=>b.onclick=()=>openConv(b.dataset.c));
  shell.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;render()});
  const c=conv(S.active);if(!c)return;
  const on=(sel,fn)=>shell.querySelectorAll(sel).forEach(el=>el.onclick=()=>fn(el));
  const find=id=>c.messages.find(m=>String(m.id)===String(id));
  on('[data-act="send"]',()=>send());
  on('[data-act="list"]',()=>{S.mobileList=true;render()});
  on('[data-act="meeting"]',()=>meetingDialog());
  on('[data-act="offer"]',()=>offerDialog());
  on('[data-act="reportUser"]',()=>reportDialog(null));
  on('[data-report]',el=>reportDialog(find(el.dataset.report)));
  on('[data-tpl]',el=>{const t=templates[+el.dataset.tpl];const l=listingOf(c);const ta=shell.querySelector('#text');
    ta.value=t.b.replace('{{buyerName}}',nameOf(c.otherEmail)).replace('{{listingTitle}}',l.title);ta.focus()});
  on('[data-slot]',el=>{const [mid,s]=el.dataset.slot.split('|');answer(c,find(mid),'ACCEPTED',+s)});
  on('[data-decline]',el=>answer(c,find(el.dataset.decline),'DECLINED'));
  on('[data-accept]',el=>answer(c,find(el.dataset.accept),'ACCEPTED'));
  on('[data-reject]',el=>answer(c,find(el.dataset.reject),'DECLINED'));
  on('[data-pay]',()=>payDialog(c));
  const ta=shell.querySelector('#text');
  if(ta)ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
}

async function send(){
  const c=conv(S.active);const ta=shell.querySelector('#text');const text=ta.value.trim();
  if(!c||!text)return;ta.value='';
  await push(c,{kind:'TEXT',body:text});
}
async function push(c,{kind,body,payload}){
  const mod=moderate([body,payload&&payload.note,payload&&payload.cond].filter(Boolean).join('\n'));
  const local={id:'t'+(++tmp),sender:me(),receiver:c.other,kind,body:body||null,payload,at:Date.now(),status:'pending',read:false};
  if(mod.verdict==='BLOCK'){local.status='blocked';c.messages.push(local);render();toast('Message not delivered: blocked by safety rules','err');return}
  if(local.body)local.body=moderate(local.body).clean;
  c.messages.push(local);render();
  const {data,error}=await db.from('messages').insert({listing_id:c.listing,receiver_id:c.other,receiver_email:c.otherEmail,kind,text:local.body||'',payload:payload||null}).select().single();
  c.messages=c.messages.filter(m=>m!==local);
  if(error){toast('Ошибка: '+error.message,'err');render();return}
  addRow(data);render();
}
async function systemMsg(c,body){
  const {data,error}=await db.from('messages').insert({listing_id:c.listing,receiver_id:c.other,receiver_email:c.otherEmail,kind:'SYSTEM',text:body}).select().single();
  if(error){toast('Ошибка: '+error.message,'err');return}
  addRow(data);render();
}
async function answer(c,m,status,chosen){
  if(!m||!m.payload)return;
  const payload={...m.payload,status};if(chosen)payload.chosen=chosen;
  const {error}=await db.from('messages').update({payload}).eq('id',m.id);
  if(error){toast('Ошибка: '+error.message,'err');return}
  m.payload=payload;render();
  const body=m.kind==='MEETING_REQUEST'
    ?(status==='ACCEPTED'?`Viewing confirmed for ${slot(chosen)}.`:'The owner could not make these times. Suggest new slots.')
    :(status==='ACCEPTED'?'Terms accepted. Pay the deposit only through the secure checkout.':'Terms declined.');
  systemMsg(c,body);
}

// ---------- dialogs ----------
const modal=document.getElementById('modal');
function dialog(title,body,onBind){
  modal.innerHTML=`<div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><button class="x" aria-label="Close">✕</button>${body}</div></div>`;
  const close=()=>modal.innerHTML='';
  modal.querySelector('.scrim').onclick=e=>{if(e.target.classList.contains('scrim'))close()};
  modal.querySelector('.x').onclick=close;
  document.onkeydown=e=>{if(e.key==='Escape')close()};
  onBind(modal.querySelector('.dlg'),close);
  const first=modal.querySelector('input,select,textarea,button.btn');first&&first.focus();
}
function reportDialog(msg){
  const c=conv(S.active);
  dialog(msg?'Report message':'Report '+nameOf(c.otherEmail),`${msg&&msg.body?`<div class="quote">“${esc(msg.body.slice(0,200))}”</div>`:''}
   <div class="reasons" role="radiogroup">${REASONS.map(([v,l],i)=>`<label><input type="radio" name="reason" value="${v}" ${i===1?'checked':''}> ${l}</label>`).join('')}</div>
   <div class="field"><label for="rc">Details (optional)</label><textarea id="rc" rows="2" maxlength="1000"></textarea></div>
   <button class="btn red" id="rs">Send report</button>`,(d,close)=>{
    d.querySelector('#rs').onclick=()=>{close();toast('Жалоба отмечена. Сохранение жалоб на сервере подключим следующим этапом.','warn')}});
}
function meetingDialog(){
  const c=conv(S.active);const local=t=>{const d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
  dialog('Request a time',`<div class="seg" id="mt">${[['SHOWING','Viewing'],['MEETING','Meeting'],['RESERVATION','Reservation']].map(([v,l],i)=>`<button data-v="${v}" aria-pressed="${i===0}">${l}</button>`).join('')}</div>
   <div class="field"><label for="s1">Option 1</label><input type="datetime-local" id="s1" value="${local(day(2,18,0))}"></div>
   <div class="field"><label for="s2">Option 2</label><input type="datetime-local" id="s2" value="${local(day(3,10,30))}"></div>
   <div class="field"><label for="s3">Option 3 (optional)</label><input type="datetime-local" id="s3"></div>
   <div class="field"><label for="mn">Note</label><input id="mn" placeholder="e.g. I can come with my partner"></div>
   <button class="btn" id="ms">Send request</button>`,(d,close)=>{
    let type='SHOWING';d.querySelectorAll('#mt button').forEach(b=>b.onclick=()=>{type=b.dataset.v;d.querySelectorAll('#mt button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
    d.querySelector('#ms').onclick=()=>{const slots=['#s1','#s2','#s3'].map(s=>d.querySelector(s).value).filter(Boolean).map(v=>new Date(v).getTime());
      if(!slots.length)return;close();
      push(c,{kind:'MEETING_REQUEST',body:null,payload:{type,slots,note:d.querySelector('#mn').value,status:'PENDING'}})}});
}
function offerDialog(){
  const c=conv(S.active);const l=listingOf(c);
  dialog('Send terms',`<div class="grid2"><div class="field"><label for="op">Price</label><input id="op" type="number" value="${l.price||''}"></div>
   <div class="field"><label for="od">Deposit</label><input id="od" type="number" value="${l.price||''}"></div>
   <div class="field"><label for="ot">Term, months</label><input id="ot" type="number" value="12"></div>
   <div class="field"><label for="om">Move-in</label><input id="om" type="date"></div></div>
   <div class="field"><label for="oc">Conditions</label><textarea id="oc" rows="2" placeholder="Pets, utilities, furniture…"></textarea></div>
   <button class="btn" id="os">Send terms</button>`,(d,close)=>{
    d.querySelector('#os').onclick=()=>{const v=s=>d.querySelector(s).value;close();
      push(c,{kind:'OFFER',body:null,payload:{price:+v('#op')||0,deposit:+v('#od')||0,term:+v('#ot')||0,moveIn:v('#om')||null,cond:v('#oc'),status:'PENDING'}})}});
}
function payDialog(c){
  dialog('Secure reservation deposit',`<p style="margin:0;color:var(--muted)">The deposit is held by the platform and released to the owner only after you confirm move-in. In the real app the payment form opens here.</p>
   <button class="btn" id="pp">Simulate successful payment</button>`,(d,close)=>{d.querySelector('#pp').onclick=()=>{close();
     systemMsg(c,'Deposit received and held securely by the platform (demo). The property is now reserved.')}});
}

render();
})();
</script>
