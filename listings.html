<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Объявления</title>
<style>
  body{font-family:sans-serif;background:#f4f5f7;margin:0;color:#222}
  header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  header a{text-decoration:none;color:#2563eb;font-weight:bold}
  main{max-width:800px;margin:20px auto;padding:0 16px}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .form{display:grid;gap:8px}
  input,textarea,button{font:inherit;padding:8px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
  button{background:#2563eb;color:#fff;border:none;cursor:pointer}
  .card img{width:100%;max-height:260px;object-fit:cover;border-radius:8px}
  #auth{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <a href="index.html">← На главную</a>
  <div id="auth"></div>
</header>
<main>
  <h1>Объявления</h1>
  <div class="card form">
    <h3 style="margin:0">Новое объявление</h3>
    <input id="lTitle" placeholder="Заголовок (например, 2-комн. квартира)">
    <input id="lPrice" type="number" placeholder="Цена">
    <input id="lAddress" placeholder="Адрес">
    <input id="lPhoto" placeholder="Ссылка на фото (необязательно)">
    <textarea id="lDesc" placeholder="Описание"></textarea>
    <button id="lAdd">Добавить объявление</button>
  </div>
  <div id="lList">Загрузка...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = supabase.createClient('https://nsakbliyojncjmuhcgyk.supabase.co', 'sb_publishable_n6JTS6hPTys5roUpXG6Unw_IhWzEO0M');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => document.getElementById(id).value.trim();

// ===== Вход =====
const auth = document.getElementById('auth');
function showLoginForm() {
  auth.innerHTML = `
    <input id="authEmail" type="email" placeholder="Email">
    <input id="authPass" type="password" placeholder="Пароль">
    <button id="btnLogin">Войти</button>
    <button id="btnSignup">Регистрация</button>`;
  document.getElementById('btnLogin').onclick = async () => {
    if (!val('authEmail') || !val('authPass')) return alert('Введите email и пароль');
    const { error } = await db.auth.signInWithPassword({ email: val('authEmail'), password: val('authPass') });
    if (error) alert('Ошибка: ' + error.message);
  };
  document.getElementById('btnSignup').onclick = async () => {
    if (!val('authEmail') || !val('authPass')) return alert('Введите email и пароль');
    const { error } = await db.auth.signUp({ email: val('authEmail'), password: val('authPass') });
    if (error) alert('Ошибка: ' + error.message);
  };
}
function showUser(user) {
  auth.innerHTML = `👤 ${esc(user.email)} <button id="btnLogout">Выйти</button>`;
  document.getElementById('btnLogout').onclick = () => db.auth.signOut();
}
db.auth.onAuthStateChange((e, session) => session ? showUser(session.user) : showLoginForm());

// ===== Объявления =====
async function loadListings() {
  const list = document.getElementById('lList');
  const { data, error } = await db.from('listings').select('*').order('created_at', { ascending: false });
  if (error) { list.textContent = 'Ошибка: ' + error.message; return; }
  if (!data.length) { list.textContent = 'Пока нет объявлений'; return; }
  list.innerHTML = data.map(l => `
    <div class="card">
      ${l.photo_url ? `<img src="${esc(l.photo_url)}">` : ''}
      <h3 style="margin:8px 0">${esc(l.title)}</h3>
      ${l.price ? `<b>Цена: ${esc(l.price)}</b>` : ''}
      ${l.address ? `<div>📍 ${esc(l.address)}</div>` : ''}
      <p>${esc(l.description)}</p>
            <a href="index.html?listing=${l.id}" style="display:inline-block;background:#1d6b52;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none">💬 Написать автору</a>
    </div>`).join('');
}

document.getElementById('lAdd').onclick = async () => {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return alert('Сначала войдите или зарегистрируйтесь');
  if (!val('lTitle')) return alert('Введите заголовок');
  const { error } = await db.from('listings').insert({
    title: val('lTitle'),
    price: Number(val('lPrice')) || null,
    address: val('lAddress'),
    photo_url: val('lPhoto') || null,
    description: val('lDesc')
  });
  if (error) return alert('Ошибка: ' + error.message);
  ['lTitle','lPrice','lAddress','lPhoto','lDesc'].forEach(id => document.getElementById(id).value = '');
  loadListings();
};

loadListings();
</script>
</body>
</html>
